# Блок для /etc/caddy/Caddyfile (сервер портала на Caddy v2, TLS автоматом).
# Авторизация — внутри приложения (страница входа + cookie, аккаунты из
# users.json портала), поэтому basic_auth здесь НЕ нужен.
# Применить: caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile && systemctl reload caddy

print.privat.kg {
	reverse_proxy localhost:8765
}
